[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

[project]
name = "odyn"
readme = "README.md"
version = "0.0.1"

# Also what Black targets.
requires-python = ">=3.10"

# caiman and OpenCV come from the conda `caiman`
dependencies = [
    "bokeh",
    "h5py",
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
    "tifffile",
    "tqdm",
]

[project.optional-dependencies]
# the entry app (`python -m odyn.app`); `nidaqmx` only on the olfactometer PC
gui = ["PySide6"]
test = ["pytest", "scikit-image"]

[tool.setuptools]
packages = ["odyn", "odyn.app"]

[tool.setuptools.package-data]
odyn = ["*.sql"]

# The icon font (Apache 2.0, so its license travels with it)
"odyn.app" = [
    "icons/*.svg",
    "assets/material-symbols/*.ttf",
    "assets/material-symbols/LICENSE.txt",
    "assets/odyn.png",
]
