[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

[project]
name = "odyn"
readme = "README.md"
version = "0.0.1"

# Also what tools target. Without it Black infers the version from the syntax
# it finds, and may rewrite f-string quotes into a form only 3.12 can parse.
requires-python = ">=3.10"

dependencies = ["tomlkit"]

# The entry app needs Qt; the cluster and the processing workstations do not,
# so it is not a dependency of `odyn` itself. Install with `pip install -e .[gui]`.
[project.optional-dependencies]
gui = ["PySide6", "qtawesome"]

[tool.setuptools]
packages = ["odyn", "odyn.app"]

[tool.setuptools.package-data]
odyn = ["*.sql"]
